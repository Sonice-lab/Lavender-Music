<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyPlaylist</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <h1 class="logo">Lavender Music</h1>
        <nav class="nav-menu">
          <a href="#" class="nav-item active">홈</a>
          <a href="#" class="nav-item">검색</a>
          <a href="#" class="nav-item">라이브러리</a>
        </nav>
        <div class="player-list">
          <h3>나의 J-POP 플레이리스트</h3>
          <a href="#" class="playlist-artist">Eve</a>
          <a href="#" class="playlist-artist">Natori</a>
          <a href="#" class="playlist-artist">King Gnu</a>
          <a href="#" class="playlist-artist">Official Higedandism</a>
          <a href="#" class="playlist-artist">YOASOBI</a>
          <a href="#" class="playlist-artist">Kensi Yonez</a>
          <a href="#" class="playlist-artist">Spyair</a>
          <a href="#" class="playlist-artist">Janne D'Arc</a>
        </div>
      </aside>
      <main class="main-content">
        <h2>Hanya님의 플레이리스트</h2>
        <div class="album-grid">
          <!-- 1번 카드 -->
          <div class="album-card">
            <img src="Eve.jpeg" alt="Eve" />
            <h4>Eve</h4>
          </div>

          <div class="album-card">
            <img src="Natori.jpeg" alt="Natori" />
            <h4>Natori</h4>
          </div>

          <div class="album-card">
            <img src="King_Gnu.jpeg" alt="King Gnu" />
            <h4>King Gnu</h4>
          </div>

          <div class="album-card">
            <img src="Official_Hige_Dandism.jpeg" alt="Official Higedandism" />
            <h4>Official Higedandism</h4>
          </div>

          <div class="album-card">
            <img src="YOASOBI.jpeg" alt="YOASOBI" />
            <h4>YOASOBI</h4>
          </div>

          <div class="album-card">
            <img src="Kensi_Yonez.jpeg" alt="Kensi Yonez" />
            <h4>Kensi Yonez</h4>
          </div>

          <div class="album-card">
            <img src="Spyair.jpeg" alt="Spyair" />
            <h4>Spyair</h4>
          </div>

          <div class="album-card">
            <img src="Janne_Da_Arc.jpeg" alt="Janne D'Arc" />
            <h4>Janne D'Arc</h4>
          </div>
        </div>
      </main>
    </div>
    <!-- player는 app-layout 밖에 두기 -->
    <!-- position: fixed를 사용할 예정이라 화면 어디에 있든 하단에 붙일 수 있지만 
     구조적으로도 app-layout과 형제 관계로 두는 것이 자연스러움-->
    <div class="player">
      <div class="player-info">
        <img src="Eve_bokurano.jpeg" alt="앨범 이미지" />
        <div class="player-text">
          <div class="music-title">Bokurano</div>
          <div class="song-artist">Eve</div>
        </div>
      </div>
      <div class="player-controls">
        <button>&#9664;&#9664;</button>
        <button class="player-btn">&#9654;</button>
        <button>&#9654;&#9654;</button>
      </div>
      <div class="player-bar">
        <div class="progress"></div>
      </div>
    </div>
  </body>
</html>
